[package]
name = "package-pilot"
version = "1.0.0"
description = "Local Node Package Testing Utility"
authors = ["PackagePilot Team"]
edition = "2021"

[dependencies]
portable-pty = "0.8.1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
notify = "6"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
env_logger = "0.11"
thiserror = "1"
anyhow = "1"
walkdir = "2"
which = "6"
pathdiff = "0.2"
dirs = "6.0.0"
regex = "1.13.0"
globset = "0.4.18"
once_cell = "1.21.4"
specta = { version = "=2.0.0-rc.25", features = ["chrono"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = { version = "0.0.12", default-features = false }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[target."cfg(unix)".dependencies]
libc = "0.2"
